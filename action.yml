name: Discord PR Sync
description: >
  Sync GitHub pull request events to a Discord forum channel as threads,
  with forum tags reflecting the PR lifecycle.

branding:
  icon: message-circle
  color: purple

inputs:
  github-token:
    description: >
      GitHub token with pull-requests: write scope.
      Usually `secrets.GITHUB_TOKEN`.
    required: true
  discord-bot-token:
    description: Discord bot token (from the Developer Portal).
    required: true
  discord-forum-channel-id:
    description: ID of the Discord forum channel for this repo.
    required: true
  discord-tag-ids-json:
    description: >
      Optional JSON map of tag name → tag ID. If omitted, the action
      fetches tag IDs from Discord on every run (one extra API call).
    required: false
    default: ''
  github-to-discord-user-map:
    description: >
      Optional JSON map of GitHub login → Discord user snowflake ID, e.g.
      '{"alice":"123456789012345678","bob":"234567890123456789"}'.
      Used to @-mention reviewers and PR authors with real Discord pings.
      If omitted, no mentions are issued.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Node 24
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        # The sync script has no dependencies. Without this, setup-node v5+
        # turns on npm caching when the caller's checked-out package.json sets
        # packageManager, and fails the step if there is no lockfile.
        package-manager-cache: false

    - name: Run sync script
      shell: bash
      run: node "${{ github.action_path }}/scripts/sync-pr.mjs"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DISCORD_BOT_TOKEN: ${{ inputs.discord-bot-token }}
        DISCORD_FORUM_CHANNEL_ID: ${{ inputs.discord-forum-channel-id }}
        DISCORD_TAG_IDS_JSON: ${{ inputs.discord-tag-ids-json }}
        DISCORD_USER_MAP_JSON: ${{ inputs.github-to-discord-user-map }}
